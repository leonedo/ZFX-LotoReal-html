<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Teleprompter</title>

    <!-- Local font -->
    <style>
        @font-face {
            font-family: 'Montserrat';
            src: url('fonts/Montserrat-ExtraBold.ttf') format('truetype');
            font-weight: 800;
            font-style: normal;
            font-display: swap; /* show fallback immediately if needed */
        }

        body {
            overflow: hidden;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            background-color: transparent;
        }

        #f0 {
            font-size: 350px;
            font-weight: 800;
            font-family: 'Montserrat', sans-serif;
            color: white;
            text-shadow: 5px 5px 15px rgba(0,0,0,0.8);
            transform: rotate(-90deg);
            margin-left: 550px;
            visibility: hidden; /* hide until font is loaded */
        }

        .alert {
            animation: blink 0.5s infinite alternate;
            border: 10px solid red;
            padding: 20px;
            border-radius: 10px;
        }

        @keyframes blink {
            0% { opacity: 1; }
            100% { opacity: 0.2; }
        }
    </style>
</head>
<body>
    <div id="f0"></div>

    <!-- FontFaceObserver -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fontfaceobserver/2.1.0/fontfaceobserver.standalone.js"></script>
    <script src="../webcg-framework.umd.js"></script>
    <script>
        const f0 = document.getElementById('f0');

        // Wait for Montserrat font to load
        const montserrat = new FontFaceObserver('Montserrat', { weight: 800 });

        montserrat.load().then(() => {
            console.log('Montserrat loaded!');
            f0.style.visibility = 'visible'; // show text after font loads

            // Update f0 text from CasparCG
            webcg.on('data', function (data) {
                if (data['f0'] !== undefined) {
                    f0.innerHTML = data['f0'];
                }
            });

            // Alert blink effect
            webcg.on('alert', function () {
                f0.classList.toggle('alert');
                setTimeout(() => f0.classList.remove('alert'), 5000);
            });

             webcg.on('stop', function () {
            console.log('stop') 
                f0.innerHTML = " ";
            });

        }).catch(() => {
            console.warn('Font failed to load, fallback will be used.');
            f0.style.visibility = 'visible'; // show anyway
        });
    </script>
</body>
</html>
