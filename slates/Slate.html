
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Slate</title>

    <style>
        body {
            overflow: hidden;
            margin: 0;
            text-align: center;
            color: white;
            background-color: transparent;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            font-family: Arial, Helvetica, sans-serif;
        }
        #text-container {
            width: 100%;
            height: 100%;
            display: none;
            background-color:black;
          
            flex-direction: column;
            justify-content: center; /* vertical center */
            align-items: center;     /* horizontal center */
        }
        #f0 {
            font-size: 120px;   /* big top text */
            font-weight: bold;
            margin-bottom: 40px;
        }

        #date {
            font-size: 60px;    /* middle date */
            font-weight: bold;
            margin-bottom: 40px;
        }

        #f1 {
            font-size: 80px;    /* bottom text */
            
        }

        #modo {
            margin-top: 10px;
            font-size: 1px;    /* bottom text */
            margin-bottom: 100px;
            color: yellow;
            opacity: 0;
        }

        .alert {
            animation: blink 0.5s infinite alternate;
            outline: 10px solid red;
            outline-offset: -10px; /* optional, pulls it inward */
            border-radius: 10px;
        }

        @keyframes blink {
            0% { opacity: 1; }
            100% { opacity: 0.2; }
        }
    </style>
</head>
<body>
    <div id="text-container">
       
        <div id="f0">  </div>
        <div id="date"></div>
        <div id="f1">  </div>
    </div>
    
    
    <script src="../webcg-framework.umd.js"></script>
    <script>
        // --- Auto insert current date ---
        function formatDate(date) {
            let d = date.getDate();
            let m = date.getMonth() + 1; // months start at 0
            let y = date.getFullYear();
            return `${d}/${m}/${y}`;
        }

        document.getElementById('date').innerHTML = formatDate(new Date());

        // --- WebCG data updates ---
        webcg.on('data', function (data) {
            console.log('new data');
            document.getElementById('text-container').style.display = "flex";
            if (data['f0'] !== undefined) {
                document.getElementById('f0').innerHTML = data['f0'];
            }
            if (data['f1'] !== undefined) {
                document.getElementById('f1').innerHTML = data['f1'];
            }
            
        });

        // --- Alert handler ---
        webcg.on('alert', function () {
            console.log('alert');
            let container = document.getElementById('f0'); // alert only on f0
            container.classList.toggle('alert');
            setTimeout(() => {
                container.classList.remove('alert');
            }, 5000);

            
        });

        webcg.on('stop', function () {
            console.log('stop') 
               document.getElementById('text-container').style.display = "none";
            });
    </script>
</body>
</html>
