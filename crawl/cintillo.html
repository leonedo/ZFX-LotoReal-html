    <style>

      @font-face {
        font-family: 'Montserrat-SemiBold';
        src: url('../fonts/Montserrat-SemiBold.ttf') format('opentype');
      }

        #bm {
            position: fixed;                 
                
        }

        #loop {
            position: fixed;  
          
        }

        body {
            overflow: hidden;
            margin: 0;

        }
 /* Wrapper for ticker */
.ticker-container {
  position: absolute;
  width: 60%;
  height: 10%;
  bottom: 8.2%;
  left: 50%;
  transform: translateX(-50%);
  overflow: hidden;
  display: flex;
  align-items: center;
  z-index: 10;
  opacity: 1;
  transition: opacity 0.5s ease;
}

.ticker-text {
  font-family: 'Montserrat-Bold', sans-serif;;
  position: absolute;
  white-space: nowrap;
  font-size: 3vw;
  animation: scroll 20s linear infinite;
  color: rgb(0, 0, 0);
}

.ticker-container.hidden {
  opacity: 0;
  pointer-events: none; /* disable interaction when hidden */
}

@keyframes scroll {
  0% {
    transform: translateX(var(--start-x));
  }
  100% {
    transform: translateX(var(--end-x));
  }
}
    </style>
    <audio id="sfxOut" src="../audio/aud_0.mp3" preload="auto"></audio>
</head>
